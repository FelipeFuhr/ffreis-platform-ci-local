name: Dependency Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  dependency-review:
    if: ${{ !github.event.pull_request.draft }}
    permissions: { contents: read, pull-requests: read }
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-dependency-review.yml@8ff19efd329b76bce5ff5b98074b9aec74b239da # v1.8.1
